<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <title>CRICZONE TV+</title>
  <meta name="description" content="CRICZONE TV+ — browse live channels in one place.">
  <meta name="theme-color" content="#0a0a0a">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon-192.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon-192.svg">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/controls.css">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box
    }

    html,body{
      width:100%;
      height:100%;
      background:#0a0a0a;
      overflow:hidden;
      font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
      -webkit-user-select:none;
      user-select:none;
      -webkit-touch-callout:none
    }

    ::-webkit-scrollbar{
      width:4px
    }

    ::-webkit-scrollbar-track{
      background:#0a0a0a
    }

    ::-webkit-scrollbar-thumb{
      background:linear-gradient(180deg,#ef4444,#f97316);
      border-radius:4px
    }

    #overlay{
      position:fixed;
      inset:0;
      background:#0a0a0a;
      z-index:9999;
      display:flex;
      align-items:center;
      justify-content:center;
      flex-direction:column;
      gap:14px
    }

    #overlay svg{
      animation:spin 1s linear infinite
    }

    @keyframes spin{
      to{transform:rotate(360deg)}
    }

    #overlay p{
      color:#555;
      font-size:13px;
      letter-spacing:.4px;
      text-align:center;
      padding:0 24px;
      font-weight:500
    }

    #channel-list{
      position:fixed;
      inset:0;
      background:#0a0a0a;
      z-index:9998;
      display:none;
      flex-direction:column;
      overflow-y:auto;
      padding:max(24px,env(safe-area-inset-top))
              16px
              max(24px,env(safe-area-inset-bottom))
    }

    #channel-list .header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding-bottom:12px;
      border-bottom:1px solid #141414;
      flex-shrink:0;
      flex-wrap:wrap;
      gap:8px
    }

    #channel-list .header h1{
      color:#fff;
      font-size:18px;
      font-weight:700;
      letter-spacing:.5px;
      background:linear-gradient(135deg,#ef4444,#f97316,#eab308);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
      background-clip:text
    }

    #channel-list .header .subtitle{
      color:#555;
      font-size:10px;
      font-weight:400;
      letter-spacing:.8px;
      text-transform:uppercase;
      background:rgba(255,255,255,0.05);
      padding:4px 12px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,0.05)
    }

    #channel-list .header .count{
      color:#666;
      font-size:11px;
      font-weight:500
    }

    #search-container{
      position:relative;
      margin-bottom:12px;
      flex-shrink:0
    }

    #search-input{
      width:100%;
      padding:10px 16px 10px 40px;
      border-radius:10px;
      border:1px solid #1a1a1a;
      background:#111;
      color:#e0e0e0;
      font-size:13px;
      outline:none;
      transition:all .3s
    }

    #search-input:focus{
      border-color:#ef4444;
      box-shadow:0 0 0 3px rgba(239,68,68,0.1);
      background:#161616
    }

    #search-input::placeholder{
      color:#555;
      font-size:12px
    }

    #search-icon{
      position:absolute;
      left:14px;
      top:50%;
      transform:translateY(-50%);
      color:#555;
      font-size:16px;
      pointer-events:none
    }

    #search-clear{
      position:absolute;
      right:12px;
      top:50%;
      transform:translateY(-50%);
      background:none;
      border:none;
      color:#555;
      font-size:16px;
      cursor:pointer;
      display:none;
      padding:4px 6px;
      border-radius:50%;
      transition:all .2s
    }

    #search-clear:hover{
      background:rgba(255,255,255,0.05);
      color:#aaa
    }

    #search-clear.visible{
      display:block
    }

    #category-filter{
      display:flex;
      gap:8px;
      overflow-x:auto;
      padding:8px 0 12px 0;
      -webkit-overflow-scrolling:touch;
      scrollbar-width:none;
      flex-shrink:0;
      border-bottom:1px solid rgba(255,255,255,0.03)
    }

    #category-filter::-webkit-scrollbar{
      display:none
    }

    .filter-pill{
      flex-shrink:0;
      padding:6px 16px;
      border-radius:20px;
      font-size:10px;
      font-weight:600;
      letter-spacing:.3px;
      text-transform:uppercase;
      cursor:pointer;
      background:#111;
      color:#666;
      border:1px solid #1a1a1a;
      transition:all .25s;
      white-space:nowrap
    }

    .filter-pill:hover{
      background:#1a1a1a;
      color:#aaa;
      transform:translateY(-1px)
    }

    .filter-pill.active{
      background:linear-gradient(135deg,#ef4444,#f97316);
      color:#fff;
      border-color:transparent;
      box-shadow:0 4px 15px rgba(239,68,68,0.3)
    }

    #grid-wrapper{
      flex:1;
      overflow-y:auto;
      overflow-x:hidden;
      padding-top:12px;
      margin:0 -4px;
      padding-right:4px
    }

    #grid-wrapper::-webkit-scrollbar{
      width:4px
    }

    #grid-wrapper::-webkit-scrollbar-track{
      background:transparent
    }

    #grid-wrapper::-webkit-scrollbar-thumb{
      background:linear-gradient(180deg,#ef4444,#f97316);
      border-radius:4px
    }

    #ch-grid{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
      gap:14px
    }

    .ch-card{
      background:linear-gradient(145deg,#111,#0d0d0d);
      border:1px solid #1a1a1a;
      border-radius:14px;
      padding:16px 12px;
      cursor:pointer;
      text-decoration:none;
      display:flex;
      flex-direction:column;
      align-items:center;
      text-align:center;
      gap:10px;
      transition:all .3s cubic-bezier(.4,0,.2,1);
      -webkit-tap-highlight-color:transparent;
      min-height:130px;
      justify-content:center;
      position:relative;
      overflow:hidden
    }

    .ch-card:hover{
      transform:translateY(-3px);
      border-color:#ef4444;
      box-shadow:0 8px 30px rgba(239,68,68,0.15)
    }

    .ch-card:active{
      transform:scale(.96)
    }

    .ch-card:focus-visible{
      outline:2px solid #ef4444;
      outline-offset:2px
    }

    .ch-card .category-badge{
      position:absolute;
      top:8px;
      right:8px;
      font-size:7px;
      font-weight:600;
      text-transform:uppercase;
      letter-spacing:.5px;
      padding:2px 8px;
      border-radius:8px;
      background:rgba(255,255,255,0.06);
      color:#666;
      border:1px solid rgba(255,255,255,0.04)
    }

    .ch-card .ch-logo{
      width:100%;
      max-width:110px;
      height:auto;
      max-height:55px;
      object-fit:contain;
      border-radius:6px;
      padding:4px;
      transition:transform .3s
    }

    .ch-card:hover .ch-logo{
      transform:scale(1.05)
    }

    .ch-card .ch-name{
      color:#e0e0e0;
      font-size:12px;
      font-weight:600;
      line-height:1.3;
      letter-spacing:.2px
    }

    .ch-card .ch-placeholder{
      width:100%;
      max-width:110px;
      height:55px;
      background:linear-gradient(135deg,#1a1a1a,#111);
      border-radius:8px;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#333;
      font-size:14px;
      font-weight:700;
      border:1px solid #1a1a1a
    }

    .ch-card .ch-placeholder .initials{
      background:linear-gradient(135deg,#ef4444,#f97316);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
      background-clip:text
    }

    #no-results{
      display:none;
      color:#555;
      text-align:center;
      padding:60px 20px;
      font-size:14px;
      width:100%;
      grid-column:1/-1
    }

    #no-results .icon{
      font-size:48px;
      margin-bottom:16px;
      display:block
    }

    #pc{
      position:fixed;
      inset:0;
      background:#000;
      display:none;
      align-items:center;
      justify-content:center;
      touch-action:manipulation
    }

    video{
      width:100%;
      height:100%;
      object-fit:contain;
      background:#000;
      will-change:transform
    }

    video.mode-fill{
      object-fit:fill
    }

    video.mode-cover{
      object-fit:cover
    }

    #status{
      position:fixed;
      top:max(12px,env(safe-area-inset-top));
      right:max(12px,env(safe-area-inset-right));
      z-index:9997;
      padding:5px 13px;
      background:rgba(8,8,8,.9);
      border:1px solid rgba(255,255,255,.05);
      font-size:11px;
      font-weight:500;
      letter-spacing:.02em;
      border-radius:20px;
      pointer-events:none;
      opacity:0;
      transition:opacity .3s;
      max-width:260px;
      text-align:right;
      backdrop-filter:blur(4px);
      -webkit-backdrop-filter:blur(4px)
    }

    #status.show{
      opacity:1
    }

    #status.ok{
      color:#ef4444
    }

    #status.warn{
      color:#fb923c
    }

    #status.err{
      color:#f87171
    }

    .sp-btn{
      background:transparent!important;
      border:none!important;
      cursor:pointer!important;
      padding:0 8px!important;
      opacity:.8;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:5px;
      height:100%;
      min-width:36px;
      transition:opacity .15s,color .15s;
      color:#fff!important;
      -webkit-tap-highlight-color:transparent
    }

    .sp-btn:hover{
      opacity:1
    }

    .sp-btn:active{
      opacity:1;
      transform:scale(.92)
    }

    .sp-btn:focus-visible{
      outline:2px solid #ef4444;
      outline-offset:2px;
      border-radius:6px
    }

    .sp-btn svg{
      width:18px;
      height:18px;
      display:block;
      pointer-events:none;
      flex-shrink:0
    }

    .sp-btn.active{
      opacity:1;
      color:#ef4444!important
    }

    .fit-ratio{
      font-size:11px;
      font-weight:600;
      letter-spacing:.2px;
      line-height:1;
      white-space:nowrap;
      pointer-events:none
    }

    .shaka-controls-container button{
      color:#fff!important
    }

    .shaka-video-container{
      background-color:#000!important
    }

    .shaka-controls-container .shaka-play-button,
    .shaka-controls-container .shaka-mute-button,
    .shaka-controls-container .shaka-volume-bar,
    .shaka-controls-container .shaka-fullscreen-button,
    .shaka-controls-container .shaka-overflow-menu-button{
      color:#ef4444!important
    }

    .shaka-controls-container .shaka-seek-bar .shaka-seek-bar-played{
      background:#ef4444!important
    }

    .shaka-controls-container .shaka-seek-bar .shaka-seek-bar-buffered{
      background:#7f1d1d!important
    }

    /* ─────────────────────────────────────────────
       TELEGRAM POPUP
       ───────────────────────────────────────────── */

    #telegramPopup{
      position:fixed;
      inset:0;
      z-index:999999;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
    }

    .telegram-backdrop{
      position:absolute;
      inset:0;
      background:rgba(0,0,0,.84);
      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);
    }

    .telegram-card{
      position:relative;
      z-index:2;
      width:min(380px,100%);
      padding:30px 22px 22px;
      text-align:center;
      background:linear-gradient(145deg,#191919,#0b0b0b);
      border:1px solid rgba(255,255,255,.08);
      border-radius:22px;
      box-shadow:0 30px 100px rgba(0,0,0,.8);
      animation:telegramIn .25s ease-out;
    }

    @keyframes telegramIn{
      from{
        opacity:0;
        transform:scale(.92) translateY(15px);
      }

      to{
        opacity:1;
        transform:scale(1) translateY(0);
      }
    }

    .telegram-icon{
      width:68px;
      height:68px;
      margin:0 auto 16px;
      display:flex;
      align-items:center;
      justify-content:center;
      border-radius:20px;
      background:linear-gradient(135deg,#229ed9,#147db0);
      font-size:30px;
      box-shadow:0 10px 30px rgba(34,158,217,.25);
    }

    .telegram-card h2{
      color:#fff;
      font-size:21px;
      font-weight:800;
    }

    .telegram-card p{
      margin-top:9px;
      color:#777;
      font-size:12px;
      line-height:1.6;
    }

    .telegram-join{
      width:100%;
      min-height:46px;
      margin-top:21px;
      display:flex;
      align-items:center;
      justify-content:center;
      border-radius:12px;
      background:linear-gradient(135deg,#229ed9,#1684ba);
      color:#fff;
      text-decoration:none;
      font-size:13px;
      font-weight:800;
      transition:transform .2s,filter .2s;
    }

    .telegram-join:hover{
      filter:brightness(1.08);
      transform:translateY(-1px);
    }

    .telegram-join:active{
      transform:scale(.98);
    }

    .telegram-continue{
      width:100%;
      min-height:44px;
      margin-top:9px;
      border-radius:12px;
      background:#151515;
      border:1px solid #292929;
      color:#aaa;
      font-size:12px;
      font-weight:700;
      cursor:pointer;
      transition:all .2s;
    }

    .telegram-continue:hover{
      background:#1d1d1d;
      color:#fff;
    }

    .telegram-continue:active{
      transform:scale(.98);
    }

    .telegram-card small{
      display:block;
      margin-top:12px;
      color:#444;
      font-size:9px;
    }

    @media (max-width:400px){
      .fit-ratio{
        font-size:9px
      }

      .sp-btn{
        padding:0 6px!important;
        gap:3px
      }

      #ch-grid{
        grid-template-columns:repeat(auto-fill,minmax(130px,1fr));
        gap:10px
      }

      .ch-card{
        min-height:110px;
        padding:12px 8px
      }

      .ch-card .ch-logo{
        max-height:40px
      }

      .ch-card .ch-name{
        font-size:10px
      }

      #channel-list .header h1{
        font-size:15px
      }

      .filter-pill{
        font-size:8px;
        padding:4px 12px
      }

      #search-input{
        font-size:12px;
        padding:8px 12px 8px 34px
      }

      .telegram-card{
        padding:26px 18px 20px;
      }

      .telegram-card h2{
        font-size:19px;
      }
    }

    @media (min-width:768px){
      #ch-grid{
        grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
        gap:18px
      }

      .ch-card{
        min-height:150px;
        padding:20px 16px
      }

      .ch-card .ch-logo{
        max-height:65px
      }

      .ch-card .ch-name{
        font-size:14px
      }
    }
  
    /* Live watching badge */
    #watchingBadge{
      position:absolute;
      top:26px;
      right:10px;
      z-index:30;
      display:flex;
      align-items:center;
      gap:5px;
      padding:5px 8px;
      border:1px solid rgba(255,255,255,.12);
      border-radius:999px;
      background:rgba(8,8,8,.76);
      color:#fff;
      font-size:10px;
      font-weight:700;
      line-height:1;
      letter-spacing:.1px;
      box-shadow:0 3px 12px rgba(0,0,0,.3);
      backdrop-filter:blur(6px);
      -webkit-backdrop-filter:blur(6px);
      pointer-events:none;
    }

    #watchingBadge .watching-dot{
      width:7px;
      height:7px;
      border-radius:50%;
      background:#22c55e;
      box-shadow:0 0 8px rgba(34,197,94,.9);
      flex:0 0 auto;
    }

    #watchingBadge.loading .watching-dot{
      background:#f59e0b;
      box-shadow:0 0 8px rgba(245,158,11,.85);
    }

    #watchingBadge .watching-text{
      white-space:nowrap;
    }

    @media (max-width:480px){
      #watchingBadge{
        top:20px;
        right:8px;
        padding:4px 7px;
        font-size:9px;
      }
    }

    #pc:fullscreen #watchingBadge,
    #pc:-webkit-full-screen #watchingBadge{
      top:max(26px, env(safe-area-inset-top));
      right:max(10px, env(safe-area-inset-right));
    }

  </style>
</head>

<body>

<div id="overlay">
  <svg width="36" height="36" viewBox="0 0 40 40" fill="none">
    <circle cx="20" cy="20" r="16" stroke="#161616" stroke-width="4"/>
    <path d="M20 4a16 16 0 0 1 16 16"
          stroke="#ef4444"
          stroke-width="4"
          stroke-linecap="round"/>
  </svg>

  <p id="loadMsg">Loading channels…</p>
</div>

<div id="status"></div>

<div id="channel-list">

  <div class="header">
    <h1>📺 CRICZONE TV+ </h1>
    <span class="subtitle">Live</span>
    <span class="count" id="channelCount">0 channels</span>
  </div>

  <div id="search-container">
    <span id="search-icon">🔍</span>

    <input
      type="text"
      id="search-input"
      placeholder="Search channels..."
      autocomplete="off"
    >

    <button id="search-clear" aria-label="Clear search">
      ✕
    </button>
  </div>

  <div id="category-filter"></div>

  <div id="grid-wrapper">
    <div id="ch-grid"></div>

    <div id="no-results">
      <span class="icon">📺</span>
      No channels found matching your search.
    </div>
  </div>

</div>

<div id="pc">

  <video
    id="v"
    playsinline
    webkit-playsinline
    preload="none"
    x5-video-player-type="h5"
    x5-video-player-fullscreen="true">
  </video>

  <div id="watchingBadge" class="loading" aria-live="polite">
    <span class="watching-dot"></span>
    <span class="watching-text">● Watching …</span>
  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>

<script src="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/shaka-player.ui.min.js"></script>

<script>
(function(){

"use strict";

/* =========================================================
   API
   ========================================================= */

var API_PRIMARY = "/api/primary";
var API_FALLBACK = "/api/fallback";
var API = API_PRIMARY;

/* =========================================================
   TELEGRAM
   ========================================================= */

var TELEGRAM_LINK = "https://t.me/+MueCDjlpoS8yNmJl";

/* =========================================================
   DOM
   ========================================================= */

var $overlay = document.getElementById("overlay");
var $loadMsg = document.getElementById("loadMsg");
var $status = document.getElementById("status");
var $list = document.getElementById("channel-list");
var $grid = document.getElementById("ch-grid");
var $gridWrapper = document.getElementById("grid-wrapper");
var $filter = document.getElementById("category-filter");
var $searchInput = document.getElementById("search-input");
var $searchClear = document.getElementById("search-clear");
var $noResults = document.getElementById("no-results");
var $channelCount = document.getElementById("channelCount");
var $pc = document.getElementById("pc");
var $vid = document.getElementById("v");
var $watchingBadge = document.getElementById("watchingBadge");
var $watchingText = $watchingBadge && $watchingBadge.querySelector(".watching-text");
if($watchingText) $watchingText.textContent = "● Watching 1560";

var firebaseConfig = {
  apiKey: "AIzaSyCFusKEh9wF7O6yux5xLQgafvcr_jCv5aA",
  authDomain: "criczone-4daa2.firebaseapp.com",
  databaseURL: "https://criczone-4daa2-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "criczone-4daa2",
  storageBucket: "criczone-4daa2.firebasestorage.app",
  messagingSenderId: "113293633217",
  appId: "1:113293633217:web:a96d9b3af3045bcd99d640"
};

var firebaseReady = false;
var watchingRef = null;
var watchingListener = null;
var watchingViewerId = null;

try{
  if(window.firebase && firebase.apps && !firebase.apps.length){
    firebase.initializeApp(firebaseConfig);
  }
  firebaseReady = !!(window.firebase && firebase.database);
}catch(e){
  console.warn("Firebase watching unavailable:", e);
}

function getWatchingChannelId(){
  var id = getChId();
  return id || "default";
}

function safeFirebaseKey(value){
  return btoa(unescape(encodeURIComponent(String(value))))
    .replace(/=+$/,"")
    .replace(/\+/g,"-")
    .replace(/\//g,"_");
}

function getViewerId(){
  var key = "criczone_live_viewer_id";
  var id = sessionStorage.getItem(key);
  if(!id){
    id = "viewer_" + Date.now() + "_" +
      Math.random().toString(36).slice(2,10);
    sessionStorage.setItem(key,id);
  }
  return id;
}

function setWatchingText(text){
  if($watchingText) $watchingText.textContent = text;
}

function startWatchingCounter(){
  if(!firebaseReady || !$watchingBadge) return;

  if(!firebase.auth){
    setWatchingText("● Live");
    $watchingBadge.classList.remove("loading");
    return;
  }

  firebase.auth().signInAnonymously()
    .then(function(){ startWatchingPresence(); })
    .catch(function(e){
      console.warn("Firebase auth unavailable:",e);
      setWatchingText("● Live");
      $watchingBadge.classList.remove("loading");
    });
}

function startWatchingPresence(){
  try{
    var channelKey = safeFirebaseKey(getWatchingChannelId());
    watchingViewerId = getViewerId();
    watchingRef = firebase.database()
      .ref("liveViewers/" + channelKey + "/" + watchingViewerId);

    watchingRef.onDisconnect().remove();

    watchingRef.set({
      active:true,
      updatedAt:firebase.database.ServerValue.TIMESTAMP
    });

    watchingListener = firebase.database()
      .ref("liveViewers/" + channelKey);

    watchingListener.on("value",function(snapshot){
      var count = snapshot.numChildren ? snapshot.numChildren() : 0;
      setWatchingText("● Watching " + (1560 + count));
      $watchingBadge.classList.remove("loading");
    });

    window.__criczoneStopWatching = function(){
      try{
        if(watchingListener) watchingListener.off();
        if(watchingRef) watchingRef.remove();
      }catch(_){}
      watchingListener = null;
      watchingRef = null;
    };

    window.addEventListener("beforeunload",function(){
      try{
        if(watchingRef) watchingRef.remove();
      }catch(_){}
    },{once:true});

    window.setInterval(function(){
      if(document.visibilityState === "visible" && watchingRef){
        watchingRef.update({
          active:true,
          updatedAt:firebase.database.ServerValue.TIMESTAMP
        }).catch(function(){});
      }
    },30000);

  }catch(e){
    console.warn("Watching counter error:",e);
    setWatchingText("● Live");
    $watchingBadge.classList.remove("loading");
  }
}

function getTier(){

  var mem = navigator.deviceMemory || 4;
  var cores = navigator.hardwareConcurrency || 4;
  var mob = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

  var conn =
    navigator.connection ||
    navigator.mozConnection ||
    navigator.webkitConnection;

  var net = conn
    ? (conn.effectiveType || "4g")
    : "4g";

  if(!mob) return "high";

  if(
    mem <= 1.5 ||
    cores <= 2 ||
    net === "slow-2g" ||
    net === "2g"
  ){
    return "low";
  }

  if(
    mem <= 3 ||
    cores <= 4
  ){
    return "mid";
  }

  return "high";
}

/* =========================================================
   LOAD DATA
   ========================================================= */

async function loadData(){

  var urls = [
    API_PRIMARY,
    API_FALLBACK
  ];

  var lastErr = null;

  for(
    var i = 0;
    i < urls.length;
    i++
  ){

    try{

      var r = await fetch(
        urls[i],
        {
          cache:"no-store",
          headers:{
            Accept:
              "application/json, text/plain, */*"
          }
        }
      );

      if(!r.ok){

        throw new Error(
          "HTTP " +
          r.status +
          " from " +
          urls[i]
        );
      }

      var text = await r.text();

      if(
        !text ||
        text.trim().length === 0
      ){

        throw new Error(
          "Empty response"
        );
      }

      var d;

      try{

        d = JSON.parse(text);

      }catch(e){

        throw new Error(
          "Invalid JSON: " +
          e.message
        );
      }

      var channels;

      if(Array.isArray(d)){

        channels = d;

      }else if(
        d &&
        Array.isArray(d.channels)
      ){

        channels = d.channels;

      }else if(
        d &&
        d.id
      ){

        channels = [d];

      }else{

        throw new Error(
          "Unexpected JSON structure"
        );
      }

      channels =
        channels.map(function(ch){

          var su =
            ch.stream_url ||
            ch.url ||
            "";

          if(su){

            su = su.replace(
              /([^:])\/\//g,
              "$1/"
            );
          }

          return {

            id:
              String(ch.id || ""),

            name:
              ch.name ||
              "Unnamed",

            stream_url:
              su,

            cookie:
              ch.cookie ||
              "",

            cookie_expires:
              ch.cookie_expires ||
              "",

            key_id:
              ch.key_id ||
              ch.keyId ||
              "",

            key:
              ch.key ||
              "",

            logo:
              ch.logo ||
              "",

            category:
              ch.category ||
              "General"
          };
        });

      channels =
        channels.filter(function(ch){

          return (
            ch.stream_url &&
            ch.stream_url.indexOf("http") === 0
          );

        });

      if(!channels.length){

        throw new Error(
          "No valid channels in response"
        );
      }

      API = urls[i];

      console.log(
        "📺 Loaded " +
        channels.length +
        " channels from " +
        API
      );

      return {
        channels:channels
      };

    }catch(err){

      lastErr = err;

      console.warn(
        "Load failed from " +
        urls[i] +
        ": " +
        err.message
      );
    }
  }

  throw new Error(
    "All sources failed. Last: " +
    (
      lastErr &&
      lastErr.message
    )
  );
}

function renderFilters(channels){

  var cats = {};

  channels.forEach(function(ch){

      ch.category &&
      ch.category !== "General"
    ){

      cats[ch.category] = true;
    }

  });

  Object.keys(cats)
    .sort()
    .forEach(function(c){

      categories.push(c);

    });

  var f =
    document.createDocumentFragment();

  categories.forEach(function(cat){

    var pill =
      document.createElement("span");

    pill.className =
      "filter-pill" +
      (
        cat === currentCategory
          ? " active"
          : ""
      );

    pill.textContent = cat;

    pill.dataset.category = cat;

    pill.addEventListener(
      "click",
      function(){

        currentCategory = cat;

        document
          .querySelectorAll(".filter-pill")

  if(currentCategory !== "All"){

      filtered.filter(function(ch){

/* =========================================================
   RATIO
   ========================================================= */

function ratioLabel(w,h){

  if(!w || !h){
    return "";
  }

  function gcd(a,b){

    return b
      ? gcd(b,a%b)
      : a;
  }

  var g =
    gcd(w,h) || 1;

  var rw = w/g;
  var rh = h/g;

  var common = {

    "16:9":16/9,
    "4:3":4/3,
    "21:9":21/9,
    "1:1":1,
    "9:16":9/16,
    "3:2":3/2,
    "5:4":5/4,
    "2:1":2

  };

  var real =
    w/h;

  var best = null;

  var bestDiff = .02;

  Object.keys(common)
    .forEach(function(k){

      var d =
        Math.abs(
          common[k] -
          real
        );

      if(d < bestDiff){

        bestDiff = d;

        best = k;
      }

    });

  if(best){
    return best;
  }

  if(
    rw <= 40 &&
    rh <= 40
  ){

    return rw + ":" + rh;
  }

  return real.toFixed(2) + ":1";
}

/* =========================================================
   CUSTOM CONTROLS
   ========================================================= */

function injectControls(
  container,
  vid,
  player
){

  var panel =
    container.querySelector(
      ".shaka-controls-button-panel"
    );

  if(!panel){
    return;
  }

  var anchor =
    panel.querySelector(
      ".shaka-fullscreen-button"
    );

  var fitIdx = 0;

  var fitBtn =
    document.createElement("button");

  fitBtn.className =
    "sp-btn sp-fit-btn";

  fitBtn.title =
    "Video fit: Fit";

  fitBtn.innerHTML =
    '<span class="fit-icon">' +
      FICO.contain +
    '</span>' +

    '<span class="fit-ratio">' +
      "--" +
    '</span>';

  if(anchor){

    panel.insertBefore(
      fitBtn,
      anchor
    );

  }else{

    panel.appendChild(
      fitBtn
    );
  }

  function applyFit(i){

    fitIdx = i;

    var m = FITS[i];

    vid.classList.remove(
      "mode-fill",
      "mode-cover"
    );

    if(m === "fill"){
      vid.classList.add(
        "mode-fill"
      );
    }

    if(m === "cover"){
      vid.classList.add(
        "mode-cover"
      );
    }

    var ic =
      fitBtn.querySelector(
        ".fit-icon"
      );

    if(ic){
      ic.innerHTML = FICO[m];
    }

    fitBtn.title =
      "Video fit: " +
      MODE_LABEL[m];
  }

  fitBtn.addEventListener(
    "click",
    function(e){

      e.stopPropagation();

      applyFit(
        (fitIdx + 1) %
        FITS.length
      );

    }
  );

  [
    "fullscreenchange",
    "webkitfullscreenchange"
  ].forEach(function(ev){

    document.addEventListener(
      ev,
      function(){

        if(
          !(
            document.fullscreenElement ||
            document.webkitFullscreenElement
          )
        ){

          applyFit(0);
        }

      }
    );

  });

  function updateRatio(){

    var lbl =
      ratioLabel(
        vid.videoWidth,
        vid.videoHeight
      );

    var badge =
      fitBtn.querySelector(
        ".fit-ratio"
      );

    if(
      badge &&
      lbl
    ){

      badge.textContent =
        lbl;
    }
  }

  vid.addEventListener(
    "loadedmetadata",
    updateRatio
  );

  vid.addEventListener(
    "resize",
    updateRatio
  );

  updateRatio();

  var pipOk =
    !!(
      document.pictureInPictureEnabled ||
      (
        vid.webkitSupportsPresentationMode &&
        typeof vid.webkitSetPresentationMode ===
          "function"
      )
    );

  if(pipOk){

    var pipBtn =
      document.createElement(
        "button"
      );

    pipBtn.className =
      "sp-btn sp-pip-btn";

    pipBtn.title =
      "Picture in Picture";

    pipBtn.innerHTML =
      PIP_ICON;

    panel.insertBefore(
      pipBtn,
      fitBtn
    );

    function setPipState(active){

      pipBtn.classList.toggle(
        "active",
        active
      );

      pipBtn.title =
        active
          ? "Exit Picture in Picture"
          : "Picture in Picture";
    }

    pipBtn.addEventListener(
      "click",
      async function(e){

        e.stopPropagation();

        try{

          if(
            document.pictureInPictureEnabled
          ){

            if(
              document.pictureInPictureElement
            ){

              await document
                .exitPictureInPicture();

            }else{

              await vid
                .requestPictureInPicture();
            }

          }else if(
            vid.webkitSupportsPresentationMode
          ){

            vid.webkitSetPresentationMode(
              vid.webkitPresentationMode ===
                "picture-in-picture"
                ? "inline"
                : "picture-in-picture"
            );
          }

        }catch(_){

          toast(
            "PiP unavailable",
            "warn",
            2500
          );
        }

      }
    );

    vid.addEventListener(
      "enterpictureinpicture",
      function(){

        setPipState(true);

      }
    );

    vid.addEventListener(
      "leavepictureinpicture",
      function(){

        setPipState(false);

      }
    );

    if(
      vid.webkitPresentationMode !==
      undefined
    ){

      vid.addEventListener(
        "webkitpresentationmodechanged",
        function(){

          setPipState(
            vid.webkitPresentationMode ===
            "picture-in-picture"
          );

        }
      );
    }
  }
}

          "https://www.criczonetv.com/";

        req.headers["User-Agent"] =
          "Mozilla/5.0 (Linux; Android 11; SM-G991B) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Mobile Safari/537.36";

        req.headers["Origin"] =
          "https://www.criczonetv.com";

        if(cookie){

          req.headers["Cookie"] =
            cookie;
        }

        if(
          type === T.MANIFEST ||
          type === T.SEGMENT
        ){

          req.uris =
            req.uris.map(
              function(u){

                return withCookie(
                  u,
                  raw
                );

              }
            );
        }

      }
    );

  var refreshing = false;
  var retries = 0;
  var edgeTried = false;
  var lastTry = 0;
  var started = false;

  function unmuteOnce(){

    $vid.muted = false;
  }

  $pc.addEventListener(
    "pointerdown",
    unmuteOnce,
    {
      capture:true,
      once:true
    }
  );

  $pc.addEventListener(
    "click",
    unmuteOnce,
    {
      capture:true,
      once:true
    }
  );

  $pc.addEventListener(
    "keydown",
    unmuteOnce,
    {
      capture:true,
      once:true
    }
  );

  function goLiveEdge(){

    if(refreshing){
      return;
    }

    try{

      player.goToLive();

      edgeTried = true;

      toast(
        "Syncing…",
        "warn",
        2000
      );

    }catch(_){

      reload();
    }
  }

  async function reload(){

    var now =
      Date.now();

    if(
      refreshing ||
      now - lastTry < 1500
    ){

      return;
    }

    if(retries >= 5){

      toast(
        "Stream unavailable.",
        "err",
        0
      );

      return;
    }

    refreshing = true;

    lastTry = now;

    retries++;

    toast(
      "Reconnecting… (" +
      retries +
      "/5)",
      "warn",
      0
    );

    try{

      var d =
        await loadData();

      var channels =
        d.channels || d;

      var fresh =
        channels.find(
          function(c){

            return c.id === ch.id;

          }
        );

      if(!fresh){

        throw new Error(
          "missing"
        );
      }

      cookie =
        fresh.cookie || "";

      raw =
        rawCookie(cookie);

      keyId =
        fresh.key_id || "";

      key =
        fresh.key || "";

      url =
        fresh.stream_url || "";

      player.configure(
        buildCfg()
      );

      await player.load(url);

      $vid.play()
        .catch(function(){});

      retries = 0;

      edgeTried = false;

      toast(
        "● Live",
        "ok",
        4000
      );

    }catch(_){

      setTimeout(
        reload,
        Math.min(
          1000 *
          Math.pow(
            2,
            retries - 1
          ),
          8000
        )
      );

    }finally{

      refreshing = false;
    }
  }

  var RECOVERABLE = [
    1001,
    1002,
    1003,
    4012,
    6006,
    6007,
    7000,
    7001,
    7002
  ];

  player.addEventListener(
    "error",
    function(ev){

      var err =
        ev.detail;

      var code =
        err && err.code;

      if(
        code === 4014 &&
        !restrictionsRelaxed
      ){

        restrictionsRelaxed =
          true;

        refreshing = true;

        player.configure(
          buildCfg()
        );

        toast(
          "Playing best available quality",
          "warn",
          2500
        );

        player.load(url)

          .then(
            function(){

              $vid.play()
                .catch(function(){});

              toast(
                "● Live",
                "ok",
                4000
              );

            }
          )

          .catch(
            function(){

              reload();

            }
          )

          .finally(
            function(){

              refreshing = false;

            }
          );

        return;
      }

      if(
        RECOVERABLE.indexOf(code) !==
        -1
      ){

        reload();

      }else{

        toast(
          shakaErrStr(err),
          "err",
          6000
        );
      }

    }
  );

  /* =========================================================
     LOAD STREAM
     ========================================================= */

  try{

    setMsg(
      "Loading stream…"
    );

    toast(
      "Loading…",
      "warn",
      0
    );

    await player.load(url);

    hideOverlay();

    toast(
      "Tap ▶ to start",
      "ok",
      5000
    );

    /*
     * TELEGRAM POPUP
     *
     * Player is already loaded.
     * Popup appears immediately after
     * successful channel load.
     */

    setTimeout(
      function(){

        showTelegramPopup();

      },
      300
    );

  }catch(_){

    hideOverlay();

    toast(
      "Retrying…",
      "warn",
      0
    );

    setTimeout(
      reload,
      1500
    );

    return;
  }

  /* =========================================================
     STALL / PLAYING
     ========================================================= */

  var stallTmr = null;

  function onStall(){

    if(
      !started ||
      stallTmr ||
      refreshing
    ){

      return;
    }

    toast(
      "Buffering…",
      "warn",
      0
    );

    stallTmr =
      setTimeout(
        function(){

          stallTmr = null;

          if(!edgeTried){

            goLiveEdge();

          }else{

            reload();

          }

        },
        5000
      );
  }

  function onPlaying(){

    started = true;

    if(stallTmr){

      clearTimeout(
        stallTmr
      );

      stallTmr = null;
    }

    edgeTried = false;

    if(!refreshing){

      toast(
        "● Live",
        "ok",
        3000
      );
    }
  }

  $vid.addEventListener(
    "waiting",
    onStall
  );

  $vid.addEventListener(
    "stalled",
    onStall
  );

  $vid.addEventListener(
    "playing",
    onPlaying
  );

  $vid.addEventListener(
    "error",
    function(){

      if(!refreshing){

        reload();

      }

    }
  );

  /* =========================================================
     VISIBILITY
     ========================================================= */

  document.addEventListener(
    "visibilitychange",
    function(){

      if(!document.hidden){

        setTimeout(
          function(){

            /*
             * IMPORTANT:
             * Don't auto-resume while
             * Telegram popup is visible.
             */

            if(
              started &&
              $vid.paused &&
              !refreshing &&
              !document.getElementById(
                "telegramPopup"
              )
            ){

              $vid.play()
                .catch(function(){});
            }

          },
          400
        );
      }

    }
  );

  /* =========================================================
     NETWORK CHANGE
     ========================================================= */

  var netConn =
    navigator.connection ||
    navigator.mozConnection ||
    navigator.webkitConnection;

  if(netConn){

    netConn.addEventListener(
      "change",
      function(){

        if(
          !player ||
          restrictionsRelaxed
        ){

          return;
        }

        var t =
          netConn.effectiveType ||
          "4g";

        var h =
          t === "slow-2g" ||
          t === "2g"
            ? 240
            : t === "3g"
              ? 480
              : PROF.maxH;

        try{

          player.configure(
            "abr.restrictions.maxHeight",
            h
          );

        }catch(_){}

        if(h < PROF.maxH){

          toast(
            "Slow network — reducing quality",
            "warn",
            3000
          );
        }

      }
    );
  }
}

/* =========================================================
   SEARCH
   ========================================================= */

function handleSearch(){

  searchQuery =
    $searchInput.value;

  $searchClear.classList.toggle(
    "visible",
    searchQuery.length > 0
  );

  applyFilters();
}

$searchInput.addEventListener(
  "input",
  handleSearch
);

$searchClear.addEventListener(
  "click",
  function(){

    $searchInput.value = "";

    searchQuery = "";

    $searchClear.classList.remove(
      "visible"
    );

    applyFilters();

    $searchInput.focus();

  }
);

$searchInput.addEventListener(
  "keydown",
  function(e){

    if(e.key === "Escape"){

      $searchClear.click();

    }

  }
);

/* =========================================================
   MAIN
   ========================================================= */

startWatchingCounter();

async function main(){

  var id =
    getChId();

  var data;

  try{

    setMsg(
      "Fetching channels…"
    );

    data =
      await loadData();

  }catch(e){

    errMsg(
      "Error loading: " +
      e.message
    );

    return;
  }

  /*
   * No channel selected:
   * show channel list.
   */

  if(!id){

    renderList(data);

    return;
  }

  var channels =
    data.channels || data;

  var ch =
    channels.find(
      function(c){

        return c.id === id;

      }
    );

  if(!ch){

    errMsg(
      "Channel not found."
    );

    return;
  }

  document.title =
    "criczonetv+ · " +
    ch.name;

  await startPlayer(ch);
}

document.addEventListener(
  "DOMContentLoaded",
  main
);

})();
</script>

        .catch(function (error) { console.warn("PWA service worker registration failed:", error); });
    });
  }
